name: Daily Briefing

on:
  schedule:
    # Target delivery: ~7:50 AM Nepal time (UTC+5:45).
    # The cron time is NOT the send time: GitHub starts scheduled runs on this
    # repo 3-4 hours late (observed: a 02:45 UTC cron produced 06:01-06:57 UTC
    # emails = ~noon in Nepal). So we queue the run the evening before, at
    # 21:45 UTC, and the "Hold" step below sleeps until 01:45 UTC (7:30 AM
    # Nepal). Even a 4-hour start delay still lands the email before 8:30 AM.
    - cron: '45 21 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub UI (skips the hold)

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Hold until 01:45 UTC (7:30 AM Nepal time)
        if: github.event_name == 'schedule'
        run: |
          # Queued 21:45 UTC for delivery the next morning. Before midnight
          # UTC the target is tomorrow 01:45; after midnight it is today
          # 01:45. If GitHub started us past the target, run immediately
          # instead of waiting a whole day.
          if [ "$(date -u +%H)" -ge 12 ]; then
            target=$(date -u -d 'tomorrow 01:45' +%s)
          else
            target=$(date -u -d 'today 01:45' +%s)
          fi
          now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Sleeping $((target - now))s until 01:45 UTC"
            sleep $((target - now))
          else
            echo "Started past 01:45 UTC (GitHub delay) — running immediately"
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google token files
        run: |
          echo "${{ secrets.GOOGLE_TOKEN_KATUWALANUP_GMAIL }}" | base64 -d > google_token_katuwalanup_gmail.com.json
          echo "${{ secrets.GOOGLE_TOKEN_COUGARS }}"           | base64 -d > google_token_akatuwal1_cougars.ccis.edu.json
          echo "${{ secrets.GOOGLE_TOKEN_NCIT }}"              | base64 -d > google_token_anup.202854_ncit.edu.np.json

      - name: Write Microsoft token cache
        run: |
          if [ -n "${{ secrets.MS_TOKEN_CACHE_HOTMAIL }}" ]; then
            echo "${{ secrets.MS_TOKEN_CACHE_HOTMAIL }}" | base64 -d > ms_token_cache_katuwalanup_hotmail.com.json
          fi
          if [ -n "${{ secrets.MS_TOKEN_CACHE_OUTLOOK }}" ]; then
            echo "${{ secrets.MS_TOKEN_CACHE_OUTLOOK }}" | base64 -d > ms_token_cache_anup.katuwal2025_outlook.com.json
          fi

      - name: Run daily briefing
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ACCOUNTS:       ${{ secrets.GMAIL_ACCOUNTS }}
          GOOGLE_CREDENTIALS_PATH: ""
          MS_CLIENT_ID:         ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID:         common
          MS_ACCOUNTS:          ${{ secrets.MS_ACCOUNTS }}
          NEWS_RSS_FEEDS:       ${{ secrets.NEWS_RSS_FEEDS }}
          GMAIL_SMTP_USER:      ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_PASSWORD:  ${{ secrets.GMAIL_SMTP_PASSWORD }}
          BRIEFING_TO_EMAIL:    ${{ secrets.BRIEFING_TO_EMAIL }}
        run: python briefing.py
